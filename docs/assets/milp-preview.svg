<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
<title id="t">MILP dispatch 2025: monthly electricity cost</title>
<desc id="d">Animated bar chart of historical vs MILP-optimized monthly electricity cost, January to October 2025 (monthly horizon). October covers data through October 10.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.85" cy="0" r="0.7">
    <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
    <stop offset="0" stop-color="#f43f5e" stop-opacity="0.14"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hist" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#9f1239" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="opt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857" stop-opacity="0.65"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="card"><rect width="960" height="520" rx="24"/></clipPath>
</defs>
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0);
          animation: grow 1.1s cubic-bezier(.22,1,.36,1) forwards; }
  .glow { opacity: 0; animation: fade .8s ease-out forwards, pulse 3.2s ease-in-out 2.6s infinite; }
  .lbl { opacity: 0; animation: rise .6s ease-out forwards; }
  .in { opacity: 0; animation: fade .7s ease-out forwards; }
  .sweep { animation: sweep 5s ease-in-out 2.4s infinite; }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes grow { to { transform: scaleY(1); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
  @keyframes sweep { 0% { transform: translateX(-260px); } 60%,100% { transform: translateX(1020px); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    .bar { animation: none; transform: none; } .glow, .lbl, .in { animation: none; opacity: 1; }
    .sweep, .dot { animation: none; }
  }
</style>
<g clip-path="url(#card)">
  <rect width="960" height="520" fill="url(#bg)"/>
  <rect width="960" height="520" fill="url(#glowA)"/>
  <rect width="960" height="520" fill="url(#glowB)"/>
</g>
<rect x="0.5" y="0.5" width="959" height="519" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

<g class="in">
  <circle class="dot" cx="54" cy="56" r="5" fill="#34d399"/>
  <text x="68" y="61" font-size="13" font-weight="700" letter-spacing="2" fill="#6ee7b7">MILP DISPATCH · 2025</text>
  <text x="50" y="96" font-size="26" font-weight="800" fill="#f8fafc">Monthly electricity cost</text>
  <text x="50" y="122" font-size="14" fill="#94a3b8">Historical vs optimized grid/cogeneration mix, monthly horizon</text>
</g>
